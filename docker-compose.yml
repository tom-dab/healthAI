services:

  # ─────────────────────────────────────────────
  # BASE DE DONNÉES PRINCIPALE (Hanane)
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: healthai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthai_network

  # ─────────────────────────────────────────────
  # API REST (Tojo)
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: healthai_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${API_SECRET_KEY}
      DEBUG: ${API_DEBUG:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/api:/app
    networks:
      - healthai_network

  # ─────────────────────────────────────────────
  # PIPELINE ETL (Houssem)
  # ─────────────────────────────────────────────
  etl:
    build:
      context: ./services/etl
      dockerfile: Dockerfile
    container_name: healthai_etl
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATA_DIR: /app/data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./services/etl:/app
      - etl_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - healthai_network

  # ─────────────────────────────────────────────
  # FRONTEND (Hélie)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: healthai_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - healthai_network

  # ─────────────────────────────────────────────
  # DASHBOARD METABASE (Houssem)
  # ─────────────────────────────────────────────
  metabase:
    image: metabase/metabase:latest
    container_name: healthai_metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB:-metabase_db}
      MB_DB_PORT: 5432
      MB_DB_HOST: postgres
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - healthai_network

  # ─────────────────────────────────────────────
  # ADMINER - Interface BDD (dev uniquement)
  # ─────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: healthai_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - healthai_network
    profiles:
      - dev

volumes:
  postgres_data:
  etl_data:

networks:
  healthai_network:
    driver: bridge
