services:

  # ─────────────────────────────────────────────
  # BASE DE DONNÉES PRINCIPALE
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: healthai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    # FIX : port exposé uniquement en dev (accès DBeaver, psql, etc.)
    # En prod, supprimer ce bloc ports: pour ne pas exposer postgres sur l'hôte
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthai_network

  # ─────────────────────────────────────────────
  # API REST
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: healthai_api
    restart: unless-stopped
    environment:
      # SOURCE UNIQUE : on utilise directement la variable .env
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${API_SECRET_KEY}
      DEBUG: ${API_DEBUG:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # FIX : hot-reload activé uniquement en dev via la variable API_DEBUG
    # En prod (API_DEBUG=false) le CMD du Dockerfile est utilisé (sans --reload)
    command: >
      sh -c "
        if [ '${API_DEBUG:-false}' = 'true' ]; then
          uvicorn main:app --host 0.0.0.0 --port 8000 --reload
        else
          uvicorn main:app --host 0.0.0.0 --port 8000
        fi
      "
    networks:
      - healthai_network

  # ─────────────────────────────────────────────
  # PIPELINE ETL
  # ─────────────────────────────────────────────
  etl:
    build:
      context: ./services/etl
      dockerfile: Dockerfile
    container_name: healthai_etl
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATA_DIR: /app/data/raw
      BDD_DIR: /app/data/clean_bdd
      ML_DIR: /app/data/clean_ml
      RAPPORT_DIR: /app/rapport
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # FIX : bind-mount ciblé — on monte uniquement les données et rapports
      # Le code et les packages pip restent ceux de l'image (pas écrasés)
      - ./services/etl/data:/app/data
      - ./services/etl/rapport:/app/rapport
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - healthai_network

  # ─────────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        # FIX : VITE_API_URL doit être injectée au BUILD (pas au runtime)
        # Le navigateur appelle localhost:8000 — correct, c'est le client qui appelle
        VITE_API_URL: http://localhost:${API_PORT:-8000}
    container_name: healthai_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - healthai_network

  # ─────────────────────────────────────────────
  # ADMINER — Interface BDD (dev uniquement)
  # ─────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: healthai_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - healthai_network

volumes:
  postgres_data:

networks:
  healthai_network:
    driver: bridge